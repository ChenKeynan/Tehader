<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תהדר – סלטים לשבת, אוכל מוכן, חלות</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="תהדר">
<meta name="theme-color" content="#fbead4">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&family=Secular+One&family=Gveret+Levin&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ec; --card: #ffffff; --ink: #2b2a26; --muted: #7a7466; --line: #eadfca;
  --green: #2f7d4f; --green-ink: #ffffff; --orange: #e8892b; --orange-soft: #fdeed8; --red: #c0392b; --ok: #2f7d4f;
  --shadow: 0 6px 20px rgba(60,40,10,.10);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.45; padding-bottom: 96px; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
#splash { position: fixed; inset: 0; z-index: 9999; background: #f9ead7; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; transition: opacity .35s ease; }
#splash.out { opacity: 0; pointer-events: none; }
#splash img:first-child { width: min(80vw, 340px); height: auto; border-radius: 0; display: block; animation: wob 2.5s ease-in-out 1 both; }
@keyframes wob { 0% { transform: rotate(0); } 25% { transform: rotate(15deg); } 50% { transform: rotate(0); } 75% { transform: rotate(-15deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
.chef { display: block; height: auto; margin: 0 auto 6px; }
#splash .chef { width: 110px; height: auto; border-radius: 0; animation: none; }
header.hero .hlogo { display: block; width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
header.hero { background: linear-gradient(160deg, var(--green), #1f5c39); color: #fff; padding: 28px 0 40px; border-radius: 0 0 28px 28px; }
header.hero h1 { font-family: 'Secular One', 'Heebo', sans-serif; font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.6rem); margin: 0; letter-spacing: .3px; }
header.hero p { margin: 6px 0 0; opacity: .92; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.badge { background: rgba(255,255,255,.18); border-radius: 99px; padding: 4px 12px; font-size: .85rem; }
nav.cats { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 12px 0 10px; margin-top: -18px; }
nav.cats .row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
nav.cats .row::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 8px 18px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.chip[aria-current="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
section.cat { padding-top: 14px; scroll-margin-top: 70px; }
section.cat h2 { font-family: 'Rubik', 'Heebo', sans-serif; font-weight: 800; font-size: 1.6rem; margin: 6px 0 10px; }
.cardlist { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 0 16px; }
.item { display: flex; gap: 14px; align-items: stretch; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .pic { flex: none; width: 112px; height: 112px; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, var(--orange-soft), color-mix(in srgb, var(--green) 18%, var(--card))); display: flex; align-items: center; justify-content: center; font-size: 3.2rem; }
.item .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item h3 { margin: 0; font-family: 'Rubik', 'Heebo', sans-serif; font-weight: 800; font-size: 1.2rem; line-height: 1.25; }
.item .desc { font-size: .95rem; margin: 4px 0 0; }
.item .per { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.item .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; padding-top: 10px; }
.item .price { font-family: 'Rubik', 'Heebo', sans-serif; font-weight: 500; font-size: 1.45rem; color: var(--ink); }
.item .price small { font-size: .9rem; font-weight: 500; margin-inline-end: 2px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
.opt { border: 1.5px solid var(--ink); background: transparent; border-radius: 99px; padding: 5px 14px; cursor: pointer; font-size: .9rem; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.pill { border-radius: 99px; padding: 11px 22px; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1.5px solid var(--ink); background: transparent; }
.pill.dark { background: #3b1d12; border-color: #3b1d12; color: #fff; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--orange-soft); border-radius: 99px; padding: 3px; }
.stepper button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--card); font-size: 1.2rem; font-weight: 800; cursor: pointer; }
.stepper span { min-width: 26px; text-align: center; font-weight: 800; }
#cartbar { position: fixed; inset: auto 0 0 0; z-index: 40; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); pointer-events: none; }
#cartbar button { pointer-events: auto; display: flex; width: 100%; max-width: 720px; margin: 0 auto; justify-content: space-between; align-items: center; background: var(--green); color: var(--green-ink); border: 0; border-radius: 16px; padding: 15px 18px; font-weight: 800; font-size: 1.05rem; box-shadow: var(--shadow); cursor: pointer; }
#cartbar[hidden] { display: none; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { font-family: 'Rubik', 'Heebo', sans-serif; font-weight: 400; margin: 0 0 4px; font-size: 1.5rem; }
.sheet .close { float: left; border: 0; background: var(--card); width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
.line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.line .nm { flex: 1; min-width: 0; font-weight: 700; }
.line .nm small { display: block; font-weight: 400; color: var(--muted); }
.sum { display: flex; justify-content: space-between; padding: 6px 0; }
.sum.total { font-size: 1.25rem; font-weight: 800; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
.sum.disc { color: var(--ok); font-weight: 700; }
.coupon { background: var(--card); border: 1.5px dashed var(--orange); border-radius: 16px; padding: 12px; margin: 14px 0; }
.coupon label { font-weight: 800; display: block; margin-bottom: 6px; }
.coupon .row { display: flex; gap: 8px; }
.coupon input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 1px; }
.field { display: block; margin: 10px 0; }
.field > span { display: block; font-weight: 700; margin-bottom: 4px; font-size: .92rem; }
input[type=text], input[type=tel], input[type=number], input[type=date], select, textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--orange) 55%, transparent); outline-offset: 1px; }
.btn { background: var(--green); color: var(--green-ink); border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; cursor: pointer; }
.btn.alt { background: var(--orange); color: #2b1a00; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.big { width: 100%; font-size: 1.1rem; padding: 15px; margin-top: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { margin-top: 6px; font-size: .9rem; font-weight: 700; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--red); }
.note { background: var(--orange-soft); border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin: 10px 0; }
.done { text-align: center; padding: 10px 0 4px; }
.done > div.big { font-size: 3rem; }
.done code { display: inline-block; background: var(--card); border: 1.5px dashed var(--line); border-radius: 10px; padding: 6px 12px; font-size: 1.2rem; letter-spacing: 2px; font-weight: 800; margin: 6px 0; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 26px 0 8px; }
footer a { color: inherit; }
/* admin */
.admin a { color: var(--green); font-weight: 700; }
.admin h1 { font-family: 'Secular One', sans-serif; font-weight: 400; }
.tabs { display: flex; gap: 8px; margin: 12px 0; }
.ord { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
.ord header { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; }
.ord ul { margin: 6px 0; padding: 0 18px 0 0; }
.st { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: .8rem; font-weight: 800; background: var(--orange-soft); }
.st.done { background: #d9f0e1; color: #1e5b36; } .st.ready { background: #dbeafe; color: #1e3a8a; }
.tbl { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
.tbl th, .tbl td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: .92rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .25s ease; } @keyframes up { from { transform: translateY(40px); opacity: .4; } } }



#sidetab { position: fixed; left: 0; top: 38%; z-index: 40; display: flex; direction: ltr; transform: translateX(-100%) translateX(34px); transition: transform .25s ease; }
#sidetab.open { transform: none; }
@media (hover: hover) { #sidetab:hover { transform: none; } }
#sidetab .sp { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 12px; background: #24613f; border-radius: 0 0 0 0; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
#sidetab .sp a { display: flex; align-items: center; justify-content: center; border-radius: 10px; }
#sidetab .sp a.ic.wa { background: #25d366; padding: 5px; }
#sidetab .sp a.ic.waze { background: #33ccff; padding: 5px; }
#sidetab .sp a.ic.maps { background: #fff; padding: 5px; }
.mapbox { position: relative; margin-top: 10px; border-radius: 16px; overflow: hidden; height: 300px; background: #e8e4da; border: 2px solid var(--gold); }
.mapbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#sidetab .sh { align-self: center; width: 34px; height: 64px; border: 0; padding: 0; cursor: pointer; background: #24613f; color: #fff; font-size: 1.6rem; font-weight: 800; border-radius: 0 14px 14px 0; box-shadow: 4px 2px 10px rgba(0,0,0,.2); }
#sidetab .sh span { display: inline-block; animation: nudge 3s ease-in-out infinite; }
#sidetab.open .sh span { animation: none; }
@keyframes nudge { 0%, 45%, 100% { transform: translateX(0); } 12% { transform: translateX(5px); } 24% { transform: translateX(-3px); } 36% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { #sidetab .sh span { animation: none; } }
header.hero { position: relative; }
header.hero .bsd { position: absolute; top: 10px; right: 16px; font-size: .75rem; opacity: .85; letter-spacing: .3px; }
.hc { margin-top: 16px; }
.hc .addr { margin: 0 0 10px; font-size: .95rem; opacity: .92; }
.hc .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.hc .acts a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 99px; font-weight: 800; text-decoration: none; background: #fff; color: #1f5c39; font-size: .95rem; }
.hc .acts a.ic { padding: 5px; border-radius: 14px; }
.hc .acts a.call { padding: 0 4px; background: transparent; border-radius: 10px; }
.hc .acts a.waze { background: #33ccff; }
.hc .acts a.wa { background: #25d366; }
.hc details { margin-top: 10px; }
.hc summary { cursor: pointer; list-style: none; display: inline-block; padding: 0 4px; }
.hc summary::-webkit-details-marker { display: none; }
.hc .map { position: relative; margin-top: 10px; border-radius: 16px; overflow: hidden; height: 280px; background: #e8e4da; }
.hc .map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ===== סגנון תפריט: קרם, ירוק כהה, זהב ===== */
:root { --bg: #fbead4; --card: #fff6e6; --ink: #2a2a20; --muted: #6b6451; --line: #d6b678; --green: #23401f; --green-ink: #fff3dc; --gold: #b3862f; --orange: #b3862f; --orange-soft: #f6e2bd; color-scheme: light; }
body { background: radial-gradient(ellipse at 50% 0, #fdf0dd, #fbead4 60%) fixed; position: relative; overflow-x: hidden; font-family: 'Heebo', sans-serif; }
:root { --lf: min(23vw, 130px); }
.lf { position: absolute; z-index: 5; pointer-events: none; height: auto; max-width: none; }
.lf.tl { top: calc(var(--lf) * .015); left: calc(var(--lf) * .02); width: var(--lf); }
.lf.tr { top: calc(var(--lf) * .01); right: 0; width: calc(var(--lf) * .872); }
.lf.bl { bottom: calc(var(--lf) * .05); left: calc(var(--lf) * .046); width: calc(var(--lf) * .592); }
.lf.br { bottom: calc(var(--lf) * .05); right: calc(var(--lf) * .097); width: calc(var(--lf) * .643); }
header.hero { background: transparent; color: var(--ink); text-align: center; padding: 22px 0 18px; border-radius: 0; }
header.hero .wrap { display: flex; flex-direction: column; align-items: center; }
header.hero .hlogo { width: min(56vw, 250px); height: auto; margin: 6px auto 6px; border: 0; border-radius: 0; padding: 0; background: none; box-shadow: none; }
header.hero .bsd { color: var(--ink); opacity: .75; z-index: 6; right: auto; left: 50%; transform: translateX(-50%); top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hand { font-family: 'Gveret Levin', 'Heebo', cursive; font-size: 1.7rem; margin: 0 0 4px; color: var(--ink); opacity: 1; }
.hand span { color: #2a2a20; font-size: 1.3rem; }
.badges { justify-content: center; }
.badge { background: transparent; border: 1.5px solid var(--gold); color: var(--green); font-weight: 700; }
.hc { width: 100%; }
.hc .map { border: 2px solid var(--gold); width: 100%; }
nav.cats { background: #fbead4; margin-top: 0; }
.chip { background: transparent; border-color: var(--gold); color: var(--green); }
.chip[aria-current="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
section.cat { text-align: center; padding-top: 22px; }
section.cat h2 { display: table; margin: 0 auto -18px; position: relative; z-index: 2; color: var(--green-ink); font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 1.45rem; padding: 4px 38px; }
section.cat h2::before { content: ''; position: absolute; inset: 0; background: var(--green); z-index: -1; filter: url(#rough); border-radius: 8px; }
.cardlist { text-align: right; background: rgba(255,248,234,.75); border: 1.5px solid var(--gold); box-shadow: none; padding: 26px 16px 4px; border-radius: 22px; }
.item { border-bottom: 1px dashed var(--line); }
.item h3 { font-family: 'Heebo', sans-serif; }
.item .pic { border: 1.5px solid var(--line); }
.item .price { font-family: 'Heebo', sans-serif; font-weight: 800; color: var(--green); }
.opt { border-color: var(--green); color: var(--green); }
.opt[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.pill.dark { background: var(--green); border-color: var(--green); color: var(--green-ink); }
#cartbar button { background: var(--green); color: var(--green-ink); border: 2px solid var(--gold); }
.sheet { background: #fbead4; }
.sheet h2 { font-family: 'Heebo', sans-serif; font-weight: 800; color: var(--green); }
.btn.alt { background: var(--gold); color: #fff; }
.admin h1 { font-family: 'Heebo', sans-serif; font-weight: 800; color: var(--green); }
#sidetab .sp, #sidetab .sh { background: var(--green); }
footer { color: var(--ink); padding-bottom: 70px; }

.kosher { position: absolute; left: 14px; top: 96px; width: 58px; height: 58px; z-index: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
.newbar { margin: 4px auto 8px; background: var(--gold); color: #fff; font-weight: 800; padding: 7px 16px; border-radius: 99px; font-size: .95rem; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.newbar a { color: #fff; text-decoration: underline; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
.facts span { background: rgba(255,248,234,.85); border: 1.5px solid var(--gold); border-radius: 99px; padding: 5px 14px; font-weight: 700; font-size: .88rem; color: var(--green); }
.dirs { text-align: right; margin-top: 10px; padding: 12px 14px; background: rgba(255,248,234,.85); border: 1.5px solid var(--gold); border-radius: 16px; font-size: .92rem; line-height: 1.6; }
.dirs b { color: var(--green); display: block; }
.dirs a { color: var(--green); font-weight: 800; }
.catnote { margin: 0 0 4px; font-size: .88rem; color: var(--muted); text-align: center; }
.rwrap { filter: drop-shadow(0 4px 8px rgba(60,40,10,.28)); margin: 14px 4px 16px; }
.receipt { background: #fffdf6; color: #2a2a20; padding: 30px 18px 32px; font-size: .95rem; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 18px 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 18px 51% repeat-x; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 18px 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 18px 51% repeat-x; }
.receipt .rlogo { display: block; width: 130px; height: auto; border-radius: 0; margin: 0 auto 4px; }
.receipt .rbsd { text-align: center; font-size: .72rem; opacity: .7; }
.receipt .rtitle { text-align: center; font-weight: 800; font-size: 1.05rem; margin-top: 4px; }
.receipt .rmeta { text-align: center; font-size: .82rem; color: var(--muted); }
.receipt .rsep { border-top: 2px dashed #cdbd9c; margin: 10px 0; }
.receipt .rrow, .receipt .ritem, .receipt .rtotal { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.receipt .ritem small { color: var(--muted); }
.receipt .ritem b, .receipt .rrow b { font-variant-numeric: tabular-nums; }
.receipt .rdisc { color: var(--ok); }
.receipt .rtotal { font-size: 1.25rem; font-weight: 800; border-top: 2px solid #2a2a20; margin-top: 6px; padding-top: 8px; }
.receipt .rnote { margin-top: 8px; font-size: .85rem; background: #f6ecd6; border-radius: 8px; padding: 6px 8px; }
.receipt .rfoot { text-align: center; font-size: .85rem; line-height: 1.6; }

/* סמל כשר: 45 מעלות שמאלה */
.kosher svg { transform: rotate(-45deg); }
/* הגדלת תמונת מוצר בלחיצה */
.item .pic img { cursor: zoom-in; }
#lb { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; cursor: zoom-out; }
#lb img { width: min(92vw, 336px); max-height: 78vh; height: auto; object-fit: contain; border-radius: 18px; background: var(--card); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
#lb .cap { color: #fff; font-weight: 800; font-size: 1.1rem; text-align: center; }
#lb button { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: #222; font-size: 1.2rem; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { #lb img { animation: lbzoom .18s ease; } @keyframes lbzoom { from { transform: scale(.7); opacity: 0; } } }
/* בחירת איסוף / משלוח */
.dsel { display: flex; gap: 8px; margin: 10px 0; }
.dsel button { flex: 1; padding: 12px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 800; font-family: inherit; cursor: pointer; }
.dsel button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.dsel small { display: block; font-weight: 500; opacity: .85; }
</style>

      '<div class="note" id="fnotebox">' + esc(CONFIG.pickupNote) + '</div><div class="msg err" id="ferr" role="alert"></div><button class="btn big" id="fsend" type="button">שלח הזמנה</button></div></div>';

    $('#xclose').onclick = closeModal;
    $('#capply').onclick = applyCode;
    $('#cin').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); applyCode(); } });
    $('#fsend').onclick = send;
    var dsel = $('#dsel'); if (dsel) dsel.addEventListener('click', function (e) { var b = e.target.closest('button[data-mode]'); if (!b) return; mode = b.dataset.mode; applyMode(); });

  function deliveryHtml() {

  function applyMode() {
    var del = mode === 'delivery' && CONFIG.delivery && CONFIG.delivery.enabled;

    var w = $('#faddrw'); if (w) w.style.display = del ? '' : 'none';

  function closeModal() { $('#modal').innerHTML = ''; }
  function paintCheckout() {
    var h = lines().map(function (l) {
      var it = findItem(l.id), k = cKey(l.id, l.opt);
      return '<div class="line" data-k="' + esc(k) + '"><div class="nm">' + esc(it.name) + (l.opt != null && it.opts ? '<small>' + esc(it.opts[l.opt].n) + '</small>' : '') + '</div><div class="stepper"><button data-minus aria-label="הפחת">−</button><span>' + l.qty + '</span><button data-plus aria-label="הוסף">+</button></div><b>' + money(linePrice(l) * l.qty) + '</b></div>';

      var r = evalCoupon(applied, sub);
      if (r.ok) s += '<div class="sum disc"><span>קופון ' + esc(applied.code) + ' <button class="opt" id="crem" type="button">הסר</button></span><span>−' + money(d) + '</span></div>';

    }
    if (mode === 'delivery' && CONFIG.delivery && CONFIG.delivery.enabled) s += '<div class="sum"><span>דמי משלוח</span><span>' + (fee() > 0 ? money(fee()) : 'חינם') + '</span></div>';

    $('#csum').innerHTML = s;
    var rm = $('#crem'); if (rm) rm.onclick = function () { applied = null; $('#cin').value = ''; setMsg('', ''); paintCheckout(); updateBar(); };
  }
  function setMsg(t, cls) { var m = $('#cmsg'); if (m) { m.textContent = t; m.className = 'msg ' + (cls || ''); } }
  function applyCode() {
    var code = ($('#cin').value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    if (!code) { setMsg('הכנס קוד קופון', 'err'); return; }
    setMsg('בודק…', '');
    store.getCoupon(code).then(function (c) {
      var r = c ? evalCoupon(c, subtotal()) : { ok: false, msg: 'קוד קופון לא קיים' };
      if (!r.ok) { applied = null; setMsg(r.msg, 'err'); paintCheckout(); updateBar(); return; }
      applied = c; setMsg('הקופון הוחל ✓', 'ok'); paintCheckout(); updateBar();

  }
  function validPhone(p) { var d = p.replace(/[^\d+]/g, '').replace(/^\+972/, '0').replace(/^972/, '0'); return /^0\d{8,9}$/.test(d) ? d : null; }
  function send() {
    var name = $('#fname').value.trim(), phone = validPhone($('#fphone').value), err = $('#ferr');
    if (name.length < 2) { err.textContent = 'נא למלא שם'; $('#fname').focus(); return; }
    if (!phone) { err.textContent = 'נא למלא מספר טלפון תקין'; $('#fphone').focus(); return; }

    err.textContent = '';
    var sub = subtotal(), disc = discount(), id = rid();

    if (del) { order.delivery = true; order.address = addr; order.fee = fee(); }
    var b = $('#fsend'); b.disabled = true; b.textContent = 'שולח…';
    store.saveOrder(order).then(function () { done(order); }).catch(function () { b.disabled = false; b.textContent = 'שלח הזמנה'; err.textContent = 'השליחה נכשלה. בדוק חיבור ונסה שוב.'; });

  function waText(o) {

  }
  function receiptHtml(o) {
    var d = new Date(o.tsd || Date.now()), when = d.toLocaleDateString('he-IL') + ' · ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    var r = '<div class="rwrap"><div class="receipt"><img class="rlogo" src="images/logo.png" alt="תהדר"><div class="rbsd">בס"ד</div><div class="rtitle">קבלה · הזמנה #' + esc(o.id) + '</div><div class="rmeta">' + esc(when) + '</div><div class="rsep"></div>';
    r += '<div class="rrow"><span>שם</span><b>' + esc(o.name) + '</b></div><div class="rrow"><span>טלפון</span><b dir="ltr">' + esc(o.phone) + '</b></div>' + (o.delivery ? '<div class="rrow"><span>משלוח</span><b>' + esc(o.address) + '</b></div><div class="rrow"><span>שעה רצויה</span><b>' + esc(o.pickup) + '</b></div>' : '<div class="rrow"><span>איסוף</span><b>' + esc(o.pickup) + '</b></div>') + '<div class="rsep"></div>';
    o.items.forEach(function (i) { r += '<div class="ritem"><span>' + i.qty + '× ' + esc(i.name) + (i.opt ? ' <small>(' + esc(i.opt) + ')</small>' : '') + '</span><b>' + money(i.price * i.qty) + '</b></div>'; });
    r += '<div class="rsep"></div><div class="rrow"><span>סכום ביניים</span><b>' + money(o.subtotal) + '</b></div>';
    if (o.discount > 0) r += '<div class="rrow rdisc"><span>קופון ' + esc(o.coupon) + '</span><b>−' + money(o.discount) + '</b></div>';
    if (o.delivery) r += '<div class="rrow"><span>דמי משלוח</span><b>' + money(o.fee) + '</b></div>';
    r += '<div class="rtotal"><span>סה״כ לתשלום</span><b>' + money(o.total) + '</b></div>';
    if (o.note) r += '<div class="rnote">הערה: ' + esc(o.note) + '</div>';
    r += '<div class="rsep"></div><div class="rfoot">' + esc(o.delivery && CONFIG.delivery ? CONFIG.delivery.note : CONFIG.pickupNote) + '<br>תודה שבחרתם בתהדר ♥<br><small>מומלץ לשמור צילום מסך של הקבלה</small></div></div></div>';
    return r;
  }
  function done(o) {
    var h = '<div class="overlay"><div class="sheet"><div class="done"><img class="chef" src="images/chef.png" alt="" width="96"><h2>ההזמנה התקבלה!</h2></div>' + receiptHtml(o);
    if (CONFIG.whatsapp) h += '<a class="btn alt big" style="display:block;text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/' + esc(CONFIG.whatsapp) + '?text=' + encodeURIComponent(waText(o)) + '">שלח גם בוואטסאפ</a>';
    if (store.mode === 'local') h += '<div class="note">מצב הדגמה: ההזמנה נשמרה רק במכשיר הזה.</div>';
    h += '<button class="btn ghost big" id="dclose">סגור</button></div></div>';
    cart = {}; applied = null; selOpt = {}; openOpt = {}; mode = 'pickup';
    $('#modal').innerHTML = h; $('#dclose').onclick = function () { closeModal(); renderMenu(); };
  }
  function renderMenuKeep() { var y = window.scrollY; renderMenu(); window.scrollTo(0, y); }

  /* =====================  ניהול  ===================== */
  function renderAdmin() {
    $('#cartbar').hidden = true; closeModal();
    var root = $('#app');
    root.innerHTML = '<div class="wrap admin"><p><a href="#">← חזרה לתפריט</a></p><h1>ניהול הזמנות</h1><div id="adm"></div></div>';
    if (store.mode === 'firebase') {
      fb.auth.onAuthStateChanged(function (u) {
        var box = $('#adm'); if (!box) return;
        if (!u) { box.innerHTML = '<button class="btn" id="gl">התחברות עם Google</button><div class="msg err" id="gerr" role="alert"></div>';
          $('#gl').onclick = function () {
            $('#gerr').textContent = '';
            fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (er) {
              var c = er && er.code || '', m = { 'auth/unauthorized-domain': 'הדומיין של האתר לא מורשה ב-Firebase (Authentication → Settings → Authorized domains).', 'auth/operation-not-allowed': 'התחברות Google לא הופעלה ב-Firebase (Authentication → Sign-in method).', 'auth/popup-blocked': 'הדפדפן חסם את החלון. אפשר חלונות קופצים לאתר ונסה שוב.', 'auth/popup-closed-by-user': 'החלון נסגר לפני סיום ההתחברות.', 'auth/cancelled-popup-request': 'הבקשה בוטלה, נסה שוב.', 'auth/network-request-failed': 'בעיית רשת, נסה שוב.' };
              $('#gerr').textContent = (m[c] || 'ההתחברות נכשלה') + ' [' + c + ']';
            });
          };
          return; }
        if (CONFIG.ownerEmails.indexOf((u.email || '').toLowerCase()) < 0 || !u.emailVerified) { box.innerHTML = '<p>אין הרשאה למשתמש ' + esc(u.email) + '</p><button class="btn ghost" id="lo">התנתק</button>'; $('#lo').onclick = function () { fb.auth.signOut(); }; return; }
        adminBody();
      });
    } else { $('#adm').innerHTML = '<div class="note">מצב הדגמה: מוצגות הזמנות שנשמרו במכשיר הזה בלבד.</div><div id="adb"></div>'; adminBody(); }
  }
  var STAT = { 'new': 'חדשה', prep: 'בהכנה', ready: 'מוכנה', done: 'נמסרה' }, NEXT = { 'new': 'prep', prep: 'ready', ready: 'done' };
  function adminBody() {
    var box = $('#adb') || $('#adm');
    box.innerHTML = '<div class="tabs"><button class="btn" id="t1">הזמנות</button><button class="btn ghost" id="t2">קופונים</button></div><div id="ap"></div>';
    var tab = 1, orders = [], coupons = [];
    function paint() {
      var p = $('#ap'); if (!p) return;
      $('#t1').className = 'btn' + (tab === 1 ? '' : ' ghost'); $('#t2').className = 'btn' + (tab === 2 ? '' : ' ghost');
      if (tab === 1) {
        if (!orders.length) { p.innerHTML = '<p>אין הזמנות עדיין.</p>'; return; }
        p.innerHTML = orders.map(function (o) {
          var tm = o.tsd ? new Date(o.tsd).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : '';
          return '<div class="ord"><header><span>#' + esc(o.id) + ' · ' + esc(o.name) + '</span><span class="st ' + esc(o.status) + '">' + esc(STAT[o.status] || o.status) + '</span></header><div>📞 <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a> · ⏰ ' + esc(o.pickup) + ' · ' + esc(tm) + '</div>' + (o.delivery ? '<div>🚚 <b>משלוח</b>: ' + esc(o.address) + ' · דמי משלוח ' + money(o.fee) + '</div>' : '<div>🏠 איסוף עצמי</div>') + '<ul>' + o.items.map(function (i) { return '<li>' + i.qty + '× ' + esc(i.name) + (i.opt ? ' (' + esc(i.opt) + ')' : '') + '</li>'; }).join('') + '</ul>' + (o.note ? '<div>📝 ' + esc(o.note) + '</div>' : '') + '<div><b>' + money(o.total) + '</b>' + (o.coupon ? ' · קופון ' + esc(o.coupon) + ' (−' + money(o.discount) + ')' : '') + '</div>' + (NEXT[o.status] ? '<button class="btn alt" data-adv="' + esc(o.id) + '" data-to="' + NEXT[o.status] + '" style="margin-top:8px">סמן: ' + STAT[NEXT[o.status]] + '</button>' : '') + '</div>';
        }).join('');
      } else {
        p.innerHTML = '<table class="tbl"><tr><th>קוד</th><th>הנחה</th><th>מינימום</th><th>תוקף</th><th></th></tr>' + coupons.map(function (c) { return '<tr><td><b>' + esc(c.code) + '</b></td><td>' + (c.type === 'percent' ? c.value + '%' : money(c.value)) + '</td><td>' + (c.min ? money(c.min) : '—') + '</td><td>' + esc(c.expires || '—') + '</td><td><button class="opt" data-del="' + esc(c.code) + '">מחק</button></td></tr>'; }).join('') + '</table>' +
          '<h3>קופון חדש</h3><div class="grid2"><label class="field"><span>קוד</span><input id="nc" type="text" maxlength="20" style="text-transform:uppercase"></label><label class="field"><span>סוג</span><select id="nt"><option value="percent">אחוזים</option><option value="fixed">סכום קבוע (₪)</option></select></label><label class="field"><span>ערך</span><input id="nv" type="number" min="1" max="1000"></label><label class="field"><span>מינימום הזמנה (₪)</span><input id="nm" type="number" min="0" value="0"></label><label class="field"><span>תוקף עד (אופציונלי)</span><input id="ne" type="date"></label></div><button class="btn" id="nadd">הוסף קופון</button><div class="msg err" id="nerr"></div>';
      }
    }
    $('#t1').onclick = function () { tab = 1; paint(); }; $('#t2').onclick = function () { tab = 2; paint(); };
    $('#ap').addEventListener('click', function (e) {
      var a = e.target.closest('[data-adv]'); if (a) { store.setStatus(a.dataset.adv, a.dataset.to).then(function () { if (store.mode === 'local') { store.watchOrders(function (o) { orders = o; paint(); }); } }); return; }
      var d = e.target.closest('[data-del]'); if (d) { store.deleteCoupon(d.dataset.del).then(function () { if (store.mode === 'local') { store.watchCoupons(function (c) { coupons = c; paint(); }); } }); return; }
      if (e.target.id === 'nadd') {
        var code = ($('#nc').value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, ''), v = Number($('#nv').value), t = $('#nt').value, er = $('#nerr');
        if (code.length < 3) { er.textContent = 'קוד קצר מדי (לפחות 3 תווים באנגלית/מספרים)'; return; }
        if (!(v > 0) || (t === 'percent' && v > 100)) { er.textContent = 'ערך לא תקין'; return; }
        store.saveCoupon({ code: code, type: t, value: v, min: Number($('#nm').value) || 0, expires: $('#ne').value || '', active: true }).then(function () { if (store.mode === 'local') { store.watchCoupons(function (c) { coupons = c; paint(); }); } });
      }
    });
    store.watchOrders(function (o, err) { if (err) { $('#ap').innerHTML = '<p>אין הרשאה לקרוא הזמנות.</p>'; return; } orders = o; paint(); });
    store.watchCoupons(function (c) { if (c) { coupons = c; paint(); } });
  }

  /* =====================  אתחול  ===================== */
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip'); if (chip) { var s = $('#cat-' + chip.dataset.cat); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var item = e.target.closest('.item'); if (!item) return;
    var pimg = e.target.closest('.pic img'); if (pimg) { openLb(pimg); return; }
    var id = item.dataset.item, it = findItem(id), o = selOpt[id] == null ? 0 : selOpt[id];
    if (e.target.closest('[data-showopts]')) { openOpt[id] = true; renderMenuKeep(); return; }
    var op = e.target.closest('.opt'); if (op) { selOpt[id] = Number(op.dataset.opt); renderMenuKeep(); return; }
    if (e.target.closest('[data-plus]')) { change(id, it.opts ? o : null, 1); renderMenuKeep(); }
    else if (e.target.closest('[data-minus]')) { change(id, it.opts ? o : null, -1); renderMenuKeep(); }
  });
  $('#cartBtn').onclick = openCheckout;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!closeLb()) closeModal(); } });
  function route() { var st = $('#sidetab'); if (st) st.style.display = location.hash === '#admin' ? 'none' : ''; if (location.hash === '#admin') renderAdmin(); else { closeModal(); renderMenu(); } }
  window.addEventListener('hashchange', route);
  var init = CONFIG.firebase ? fbStore().catch(function () { return localStore(); }) : Promise.resolve(localStore());
  mountSideTab();
  init.then(function (s) {
    store = s; route();
    if (s.mode === 'firebase' && fb && fb.auth) {
      var unsub = null;
      fb.auth.onAuthStateChanged(function (u) {
        if (unsub) { unsub(); unsub = null; }
        if (u && u.emailVerified && CONFIG.ownerEmails.indexOf((u.email || '').toLowerCase()) >= 0) {
          unsub = s.watchNew(function (n) { newCount = n; paintNewBar(); });
        } else { newCount = 0; paintNewBar(); }
      });
    }
  });
  window.__salads = { cart: function () { return cart; }, store: function () { return store; } };
})();
</script>
</body>
</html>
