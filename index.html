<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סלטים ושניצלים – הזמנה אונליין</title>
<meta name="theme-color" content="#2f7d4f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ec; --card: #ffffff; --ink: #2b2a26; --muted: #7a7466; --line: #eadfca;
  --green: #2f7d4f; --green-ink: #ffffff; --orange: #e8892b; --orange-soft: #fdeed8; --red: #c0392b; --ok: #2f7d4f;
  --shadow: 0 6px 20px rgba(60,40,10,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1a17; --card: #26241f; --ink: #f3ecdd; --muted: #b3aa96; --line: #3a362d; --green: #4fa874; --green-ink: #0f2218; --orange: #f0a04d; --orange-soft: #3a2c18; --red: #ff7a6b; --shadow: 0 6px 20px rgba(0,0,0,.4); }
}
:root[data-theme="dark"] { --bg: #1b1a17; --card: #26241f; --ink: #f3ecdd; --muted: #b3aa96; --line: #3a362d; --green: #4fa874; --green-ink: #0f2218; --orange: #f0a04d; --orange-soft: #3a2c18; --red: #ff7a6b; --shadow: 0 6px 20px rgba(0,0,0,.4); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.45; padding-bottom: 96px; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
header.hero { background: linear-gradient(160deg, var(--green), #1f5c39); color: #fff; padding: 28px 0 40px; border-radius: 0 0 28px 28px; }
header.hero h1 { font-family: 'Secular One', 'Heebo', sans-serif; font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.6rem); margin: 0; letter-spacing: .3px; }
header.hero p { margin: 6px 0 0; opacity: .92; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.badge { background: rgba(255,255,255,.18); border-radius: 99px; padding: 4px 12px; font-size: .85rem; }
nav.cats { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 12px 0 10px; margin-top: -18px; }
nav.cats .row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
nav.cats .row::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 8px 18px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.chip[aria-current="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
section.cat { padding-top: 14px; scroll-margin-top: 70px; }
section.cat h2 { font-family: 'Secular One', 'Heebo', sans-serif; font-weight: 400; font-size: 1.45rem; margin: 6px 0 10px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: flex-start; }
.item .info { flex: 1; min-width: 0; }
.item h3 { margin: 0; font-size: 1.05rem; font-weight: 800; }
.item .desc { color: var(--muted); font-size: .9rem; margin: 2px 0 6px; }
.item .price { font-weight: 800; color: var(--green); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
.opt { border: 1.5px solid var(--line); background: transparent; border-radius: 10px; padding: 4px 10px; cursor: pointer; font-size: .88rem; }
.opt[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); font-weight: 700; }
.addbtn { background: var(--orange); color: #2b1a00; border: 0; border-radius: 12px; padding: 9px 16px; font-weight: 800; cursor: pointer; white-space: nowrap; align-self: center; }
.stepper { display: inline-flex; align-items: center; gap: 4px; align-self: center; background: var(--orange-soft); border-radius: 12px; padding: 3px; }
.stepper button { width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--card); font-size: 1.2rem; font-weight: 800; cursor: pointer; }
.stepper span { min-width: 26px; text-align: center; font-weight: 800; }
#cartbar { position: fixed; inset: auto 0 0 0; z-index: 40; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); pointer-events: none; }
#cartbar button { pointer-events: auto; display: flex; width: 100%; max-width: 720px; margin: 0 auto; justify-content: space-between; align-items: center; background: var(--green); color: var(--green-ink); border: 0; border-radius: 16px; padding: 15px 18px; font-weight: 800; font-size: 1.05rem; box-shadow: var(--shadow); cursor: pointer; }
#cartbar[hidden] { display: none; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { font-family: 'Secular One', 'Heebo', sans-serif; font-weight: 400; margin: 0 0 4px; font-size: 1.5rem; }
.sheet .close { float: left; border: 0; background: var(--card); width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
.line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.line .nm { flex: 1; min-width: 0; font-weight: 700; }
.line .nm small { display: block; font-weight: 400; color: var(--muted); }
.sum { display: flex; justify-content: space-between; padding: 6px 0; }
.sum.total { font-size: 1.25rem; font-weight: 800; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
.sum.disc { color: var(--ok); font-weight: 700; }
.coupon { background: var(--card); border: 1.5px dashed var(--orange); border-radius: 16px; padding: 12px; margin: 14px 0; }
.coupon label { font-weight: 800; display: block; margin-bottom: 6px; }
.coupon .row { display: flex; gap: 8px; }
.coupon input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 1px; }
.field { display: block; margin: 10px 0; }
.field > span { display: block; font-weight: 700; margin-bottom: 4px; font-size: .92rem; }
input[type=text], input[type=tel], input[type=number], input[type=date], select, textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--orange) 55%, transparent); outline-offset: 1px; }
.btn { background: var(--green); color: var(--green-ink); border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; cursor: pointer; }
.btn.alt { background: var(--orange); color: #2b1a00; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.big { width: 100%; font-size: 1.1rem; padding: 15px; margin-top: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg { margin-top: 6px; font-size: .9rem; font-weight: 700; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--red); }
.note { background: var(--orange-soft); border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin: 10px 0; }
.done { text-align: center; padding: 10px 0 4px; }
.done .big { font-size: 3rem; }
.done code { display: inline-block; background: var(--card); border: 1.5px dashed var(--line); border-radius: 10px; padding: 6px 12px; font-size: 1.2rem; letter-spacing: 2px; font-weight: 800; margin: 6px 0; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 26px 0 8px; }
footer a { color: inherit; }
/* admin */
.admin a { color: var(--green); font-weight: 700; }
.admin h1 { font-family: 'Secular One', sans-serif; font-weight: 400; }
.tabs { display: flex; gap: 8px; margin: 12px 0; }
.ord { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
.ord header { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; }
.ord ul { margin: 6px 0; padding: 0 18px 0 0; }
.st { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: .8rem; font-weight: 800; background: var(--orange-soft); }
.st.done { background: #d9f0e1; color: #1e5b36; } .st.ready { background: #dbeafe; color: #1e3a8a; }
.tbl { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
.tbl th, .tbl td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: .92rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .25s ease; } @keyframes up { from { transform: translateY(40px); opacity: .4; } } }
</style>
</head>
<body>
<div id="app"></div>
<div id="cartbar" hidden><button id="cartBtn" type="button"><span id="cartCount"></span><span>לקופה ←</span><span id="cartTotal"></span></button></div>
<div id="modal"></div>
<script>
(function () {
  'use strict';

  /* =====================  הגדרות — כאן משנים  ===================== */
  var CONFIG = {
    name: 'סלטים ושניצלים',                 // שם העסק
    tagline: 'הזמנה אונליין · טרי · מוכן לאיסוף',
    whatsapp: '',                            // מספר לקבלת הזמנות בוואטסאפ, בפורמט בינלאומי בלי + (למשל 972501234567). ריק = בלי כפתור
    pickupNote: 'התשלום מתבצע בעת האיסוף.',
    pickupSlots: ['כמה שיותר מהר', '12:00', '12:30', '13:00', '13:30', '14:00', '17:00', '18:00', '19:00'],
    ownerEmails: ['chenkeynan@gmail.com', 'edenkeynan@gmail.com', 'yaakov414@gmail.com'],   // מי מורשה למסך הניהול (גם בכללי Firebase!)
    firebase: { apiKey: 'AIzaSyAhWX7jdMHYMHAyIab0_j18dJ6i7CJNuZs', authDomain: 'tidhar-dfc18.firebaseapp.com', projectId: 'tidhar-dfc18', storageBucket: 'tidhar-dfc18.firebasestorage.app', messagingSenderId: '1002257905072', appId: '1:1002257905072:web:a43f0010fbb8b67d461275' }, // הגדרות Firebase של הפרויקט Tidhar
  };
  var MENU = [
    { id: 'salads', name: 'סלטים', items: [
      { id: 's1', name: 'סלט ירקות קצוץ', desc: 'עגבנייה, מלפפון, בצל, פטרוזיליה, לימון', price: 28, opts: [{ n: 'קטן', d: 0 }, { n: 'גדול', d: 10 }] },
      { id: 's2', name: 'סלט יווני', desc: 'פטה, זיתים, בצל סגול, עגבנייה', price: 34, opts: [{ n: 'קטן', d: 0 }, { n: 'גדול', d: 10 }] },
      { id: 's3', name: 'סלט קיסר', desc: 'חסה, קרוטונים, פרמזן, רוטב קיסר', price: 36, opts: [{ n: 'קטן', d: 0 }, { n: 'גדול', d: 10 }] },
      { id: 's4', name: 'סלט כרוב סגול', desc: 'כרוב, גזר, תפוח, רוטב חרדל-דבש', price: 26 }
    ] },
    { id: 'schnitzel', name: 'שניצלים ומנות', items: [
      { id: 'n1', name: 'שניצל קלאסי', desc: '200 גרם, פירורי לחם זהובים', price: 48 },
      { id: 'n2', name: 'שניצל קורנפלקס', desc: 'עטוף פריכות קורנפלקס', price: 52 },
      { id: 'n3', name: 'מנת שניצל + 2 תוספות', desc: 'שניצל קלאסי ושתי תוספות לבחירה', price: 62 },
      { id: 'n4', name: 'שניצלוני ילדים', desc: '6 יחידות עם צ׳יפס', price: 38 }
    ] },
    { id: 'sides', name: 'תוספות', items: [
      { id: 'd1', name: 'אורז לבן', desc: '', price: 14 },
      { id: 'd2', name: 'צ׳יפס', desc: '', price: 16 },
      { id: 'd3', name: 'פירה תפוחי אדמה', desc: '', price: 16 },
      { id: 'd4', name: 'ירקות מוקפצים', desc: '', price: 18 }
    ] }
  ];
  var DEMO_COUPONS = [
    { code: 'WELCOME10', type: 'percent', value: 10, min: 0, expires: '', active: true },
    { code: 'SCHNITZEL15', type: 'fixed', value: 15, min: 80, expires: '', active: true }
  ];

  /* =====================  כלים  ===================== */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '₪' + (Math.round(n * 100) / 100).toString(); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function rid() { var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '', i; try { var u = new Uint32Array(8); crypto.getRandomValues(u); for (i = 0; i < 8; i++) s += a[u[i] % a.length]; } catch (e) { for (i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)]; } return s; }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  /* =====================  אחסון: Firebase או מקומי  ===================== */
  var store = { mode: 'local' }, fb = null;
  var listeners = [];
  function notify() { listeners.forEach(function (f) { f(); }); }

  function localStore() {
    return {
      mode: 'local',
      saveOrder: function (o) { var a = lsGet('salads.orders', []); a.unshift(o); lsSet('salads.orders', a); return Promise.resolve(); },
      watchOrders: function (cb) { cb(lsGet('salads.orders', [])); },
      setStatus: function (id, st) { var a = lsGet('salads.orders', []); a.forEach(function (o) { if (o.id === id) o.status = st; }); lsSet('salads.orders', a); return Promise.resolve(); },
      getCoupon: function (code) { var a = lsGet('salads.coupons', DEMO_COUPONS); return Promise.resolve(a.filter(function (c) { return c.code === code; })[0] || null); },
      watchCoupons: function (cb) { cb(lsGet('salads.coupons', DEMO_COUPONS)); },
      saveCoupon: function (c) { var a = lsGet('salads.coupons', DEMO_COUPONS).filter(function (x) { return x.code !== c.code; }); a.push(c); lsSet('salads.coupons', a); return Promise.resolve(); },
      deleteCoupon: function (code) { lsSet('salads.coupons', lsGet('salads.coupons', DEMO_COUPONS).filter(function (x) { return x.code !== code; })); return Promise.resolve(); }
    };
  }
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  function fbStore() {
    var base = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-';
    return loadScript(base + 'app-compat.js').then(function () { return loadScript(base + 'firestore-compat.js'); }).then(function () { return loadScript(base + 'auth-compat.js'); }).then(function () {
      firebase.initializeApp(CONFIG.firebase); var db = firebase.firestore(); fb = { db: db, auth: firebase.auth() };
      var O = db.collection('orders'), C = db.collection('coupons');
      return {
        mode: 'firebase',
        saveOrder: function (o) { var d = Object.assign({}, o); d.ts = firebase.firestore.FieldValue.serverTimestamp(); return O.doc(o.id).set(d); },
        watchOrders: function (cb) { O.orderBy('ts', 'desc').limit(200).onSnapshot(function (s) { cb(s.docs.map(function (d) { var x = d.data(); x.id = d.id; x.tsd = x.ts && x.ts.toDate ? x.ts.toDate().getTime() : Date.now(); return x; })); }, function (e) { cb(null, e); }); },
        setStatus: function (id, st) { return O.doc(id).update({ status: st }); },
        getCoupon: function (code) { return C.doc(code).get().then(function (d) { return d.exists ? d.data() : null; }); },
        watchCoupons: function (cb) { C.onSnapshot(function (s) { cb(s.docs.map(function (d) { return d.data(); })); }, function (e) { cb(null, e); }); },
        saveCoupon: function (c) { return C.doc(c.code).set(c); },
        deleteCoupon: function (code) { return C.doc(code).delete(); }
      };
    });
  }

  /* =====================  סל וקופונים  ===================== */
  var cart = {};           // key -> {id, opt, qty}
  var applied = null;      // coupon object
  function findItem(id) { for (var i = 0; i < MENU.length; i++) for (var j = 0; j < MENU[i].items.length; j++) if (MENU[i].items[j].id === id) return MENU[i].items[j]; return null; }
  function linePrice(l) { var it = findItem(l.id), p = it.price; if (l.opt != null && it.opts) { p += it.opts[l.opt].d; } return p; }
  function lines() { return Object.keys(cart).map(function (k) { return cart[k]; }).filter(function (l) { return l.qty > 0; }); }
  function subtotal() { return lines().reduce(function (s, l) { return s + linePrice(l) * l.qty; }, 0); }
  function count() { return lines().reduce(function (s, l) { return s + l.qty; }, 0); }
  function evalCoupon(c, sub) {
    if (!c || !c.active) return { ok: false, msg: 'הקופון לא תקף' };
    if (c.expires && c.expires < todayKey()) return { ok: false, msg: 'תוקף הקופון פג' };
    if (c.min && sub < c.min) return { ok: false, msg: 'הקופון תקף בהזמנה מעל ' + money(c.min) };
    var d = c.type === 'percent' ? sub * c.value / 100 : c.value;
    d = Math.min(Math.round(d * 100) / 100, sub);
    return { ok: true, discount: d };
  }
  function discount() { if (!applied) return 0; var r = evalCoupon(applied, subtotal()); return r.ok ? r.discount : 0; }
  function total() { return Math.max(0, subtotal() - discount()); }
  function cKey(id, opt) { return id + '|' + (opt == null ? '' : opt); }

  /* =====================  תצוגת תפריט  ===================== */
  var selOpt = {};   // itemId -> option index (default 0)
  function renderMenu() {
    var h = '<header class="hero"><div class="wrap"><h1>' + esc(CONFIG.name) + '</h1><p>' + esc(CONFIG.tagline) + '</p><div class="badges"><span class="badge">🥗 סלטים טריים</span><span class="badge">🍗 שניצל חם</span><span class="badge">🏷️ קופונים</span></div></div></header>';
    h += '<nav class="cats"><div class="row">' + MENU.map(function (c, i) { return '<button class="chip" data-cat="' + c.id + '"' + (i === 0 ? ' aria-current="true"' : '') + '>' + esc(c.name) + '</button>'; }).join('') + '</div></nav><main class="wrap">';
    MENU.forEach(function (c) {
      h += '<section class="cat" id="cat-' + c.id + '"><h2>' + esc(c.name) + '</h2>';
      c.items.forEach(function (it) {
        var o = selOpt[it.id] == null ? 0 : selOpt[it.id];
        var key = cKey(it.id, it.opts ? o : null), q = cart[key] ? cart[key].qty : 0;
        var price = it.price + (it.opts ? it.opts[o].d : 0);
        h += '<div class="item" data-item="' + it.id + '"><div class="info"><h3>' + esc(it.name) + '</h3>' + (it.desc ? '<div class="desc">' + esc(it.desc) + '</div>' : '');
        if (it.opts) h += '<div class="opts" role="group" aria-label="גודל">' + it.opts.map(function (op, i) { return '<button class="opt" data-opt="' + i + '" aria-pressed="' + (i === o) + '">' + esc(op.n) + '</button>'; }).join('') + '</div>';
        h += '<div class="price">' + money(price) + '</div></div>';
        h += q ? '<div class="stepper"><button data-minus aria-label="הפחת">−</button><span>' + q + '</span><button data-plus aria-label="הוסף">+</button></div>' : '<button class="addbtn" data-plus>הוסף</button>';
        h += '</div>';
      });
      h += '</section>';
    });
    h += '<footer>' + esc(CONFIG.pickupNote) + '<br><a href="#admin">ניהול</a></footer></main>';
    $('#app').innerHTML = h;
    updateBar();
  }
  function updateBar() {
    var n = count(), bar = $('#cartbar');
    bar.hidden = n === 0;
    $('#cartCount').textContent = '🛒 ' + n + (n === 1 ? ' פריט' : ' פריטים');
    $('#cartTotal').textContent = money(total());
  }
  function change(id, opt, delta) {
    var k = cKey(id, opt);
    if (!cart[k]) cart[k] = { id: id, opt: opt, qty: 0 };
    cart[k].qty = Math.max(0, Math.min(30, cart[k].qty + delta));
    if (!cart[k].qty) delete cart[k];
  }

  /* =====================  קופה  ===================== */
  function openCheckout() {
    if (!count()) return;
    var h = '<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="קופה"><button class="close" id="xclose" aria-label="סגור">✕</button><h2>הקופה</h2><div id="clines"></div><div class="coupon"><label for="cin">יש לך קוד קופון?</label><div class="row"><input id="cin" type="text" autocomplete="off" autocapitalize="characters" placeholder="הכנס קוד קופון"><button class="btn alt" id="capply" type="button">החל</button></div><div class="msg" id="cmsg" role="status"></div></div><div id="csum"></div>' +
      '<label class="field"><span>שם מלא</span><input id="fname" type="text" autocomplete="name" maxlength="60"></label>' +
      '<label class="field"><span>טלפון</span><input id="fphone" type="tel" autocomplete="tel" inputmode="tel" maxlength="16" placeholder="050-0000000"></label>' +
      '<label class="field"><span>מתי לאסוף?</span><select id="fpick">' + CONFIG.pickupSlots.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>הערות להזמנה (אופציונלי)</span><textarea id="fnote" rows="2" maxlength="200"></textarea></label>' +
      '<div class="note">' + esc(CONFIG.pickupNote) + '</div><div class="msg err" id="ferr" role="alert"></div><button class="btn big" id="fsend" type="button">שלח הזמנה</button></div></div>';
    $('#modal').innerHTML = h;
    paintCheckout();
    $('#ov').addEventListener('click', function (e) { if (e.target.id === 'ov') closeModal(); });
    $('#xclose').onclick = closeModal;
    $('#capply').onclick = applyCode;
    $('#cin').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); applyCode(); } });
    $('#fsend').onclick = send;
    $('#clines').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; var row = b.closest('[data-k]'); if (!row) return; var l = cart[row.dataset.k]; if (!l) return;
      change(l.id, l.opt, b.hasAttribute('data-plus') ? 1 : -1); paintCheckout(); updateBar(); renderMenuKeep(); if (!count()) closeModal();
    });
  }
  function closeModal() { $('#modal').innerHTML = ''; }
  function paintCheckout() {
    var h = lines().map(function (l) {
      var it = findItem(l.id), k = cKey(l.id, l.opt);
      return '<div class="line" data-k="' + esc(k) + '"><div class="nm">' + esc(it.name) + (l.opt != null && it.opts ? '<small>' + esc(it.opts[l.opt].n) + '</small>' : '') + '</div><div class="stepper"><button data-minus aria-label="הפחת">−</button><span>' + l.qty + '</span><button data-plus aria-label="הוסף">+</button></div><b>' + money(linePrice(l) * l.qty) + '</b></div>';
    }).join('');
    $('#clines').innerHTML = h;
    var sub = subtotal(), d = discount(), s = '<div class="sum"><span>סכום ביניים</span><span>' + money(sub) + '</span></div>';
    if (applied) {
      var r = evalCoupon(applied, sub);
      if (r.ok) s += '<div class="sum disc"><span>קופון ' + esc(applied.code) + ' <button class="opt" id="crem" type="button">הסר</button></span><span>−' + money(d) + '</span></div>';
      else { applied = null; setMsg('הקופון הוסר: ' + r.msg, 'err'); }
    }
    s += '<div class="sum total"><span>סה״כ לתשלום</span><span>' + money(total()) + '</span></div>';
    $('#csum').innerHTML = s;
    var rm = $('#crem'); if (rm) rm.onclick = function () { applied = null; $('#cin').value = ''; setMsg('', ''); paintCheckout(); updateBar(); };
  }
  function setMsg(t, cls) { var m = $('#cmsg'); if (m) { m.textContent = t; m.className = 'msg ' + (cls || ''); } }
  function applyCode() {
    var code = ($('#cin').value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    if (!code) { setMsg('הכנס קוד קופון', 'err'); return; }
    setMsg('בודק…', '');
    store.getCoupon(code).then(function (c) {
      var r = c ? evalCoupon(c, subtotal()) : { ok: false, msg: 'קוד קופון לא קיים' };
      if (!r.ok) { applied = null; setMsg(r.msg, 'err'); paintCheckout(); updateBar(); return; }
      applied = c; setMsg('הקופון הוחל ✓', 'ok'); paintCheckout(); updateBar();
    }).catch(function () { setMsg('לא ניתן לבדוק קופון כרגע, נסה שוב', 'err'); });
  }
  function validPhone(p) { var d = p.replace(/[^\d+]/g, '').replace(/^\+972/, '0').replace(/^972/, '0'); return /^0\d{8,9}$/.test(d) ? d : null; }
  function send() {
    var name = $('#fname').value.trim(), phone = validPhone($('#fphone').value), err = $('#ferr');
    if (name.length < 2) { err.textContent = 'נא למלא שם'; $('#fname').focus(); return; }
    if (!phone) { err.textContent = 'נא למלא מספר טלפון תקין'; $('#fphone').focus(); return; }
    err.textContent = '';
    var sub = subtotal(), disc = discount(), id = rid();
    var order = { id: id, name: name, phone: phone, pickup: $('#fpick').value, note: $('#fnote').value.trim(), items: lines().map(function (l) { var it = findItem(l.id); return { name: it.name, opt: l.opt != null && it.opts ? it.opts[l.opt].n : '', qty: l.qty, price: linePrice(l) }; }), subtotal: sub, coupon: applied && disc > 0 ? applied.code : '', discount: disc, total: Math.max(0, sub - disc), status: 'new', tsd: Date.now() };
    var b = $('#fsend'); b.disabled = true; b.textContent = 'שולח…';
    store.saveOrder(order).then(function () { done(order); }).catch(function () { b.disabled = false; b.textContent = 'שלח הזמנה'; err.textContent = 'השליחה נכשלה. בדוק חיבור ונסה שוב.'; });
  }
  function waText(o) {
    var t = 'הזמנה חדשה #' + o.id + '\n' + o.name + ' · ' + o.phone + '\nאיסוף: ' + o.pickup + '\n';
    o.items.forEach(function (i) { t += '• ' + i.qty + '× ' + i.name + (i.opt ? ' (' + i.opt + ')' : '') + ' – ' + money(i.price * i.qty) + '\n'; });
    if (o.coupon) t += 'קופון ' + o.coupon + ': −' + money(o.discount) + '\n';
    t += 'סה״כ: ' + money(o.total) + (o.note ? '\nהערה: ' + o.note : '');
    return t;
  }
  function done(o) {
    var h = '<div class="overlay"><div class="sheet"><div class="done"><div class="big">✅</div><h2>ההזמנה התקבלה!</h2><p>מספר הזמנה:</p><code>' + esc(o.id) + '</code><p>סה״כ ' + money(o.total) + ' · ' + esc(CONFIG.pickupNote) + '</p>';
    if (CONFIG.whatsapp) h += '<a class="btn alt big" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/' + esc(CONFIG.whatsapp) + '?text=' + encodeURIComponent(waText(o)) + '">שלח גם בוואטסאפ</a>';
    if (store.mode === 'local') h += '<div class="note">מצב הדגמה: ההזמנה נשמרה רק במכשיר הזה.</div>';
    h += '<button class="btn ghost big" id="dclose">סגור</button></div></div></div>';
    cart = {}; applied = null; selOpt = {};
    $('#modal').innerHTML = h; $('#dclose').onclick = function () { closeModal(); renderMenu(); };
  }
  function renderMenuKeep() { var y = window.scrollY; renderMenu(); window.scrollTo(0, y); }

  /* =====================  ניהול  ===================== */
  function renderAdmin() {
    $('#cartbar').hidden = true; closeModal();
    var root = $('#app');
    root.innerHTML = '<div class="wrap admin"><p><a href="#">← חזרה לתפריט</a></p><h1>ניהול הזמנות</h1><div id="adm"></div></div>';
    if (store.mode === 'firebase') {
      fb.auth.onAuthStateChanged(function (u) {
        var box = $('#adm'); if (!box) return;
        if (!u) { box.innerHTML = '<button class="btn" id="gl">התחברות עם Google</button><div class="msg err" id="gerr" role="alert"></div>';
          $('#gl').onclick = function () {
            $('#gerr').textContent = '';
            fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (er) {
              var c = er && er.code || '', m = { 'auth/unauthorized-domain': 'הדומיין של האתר לא מורשה ב-Firebase (Authentication → Settings → Authorized domains).', 'auth/operation-not-allowed': 'התחברות Google לא הופעלה ב-Firebase (Authentication → Sign-in method).', 'auth/popup-blocked': 'הדפדפן חסם את החלון. אפשר חלונות קופצים לאתר ונסה שוב.', 'auth/popup-closed-by-user': 'החלון נסגר לפני סיום ההתחברות.', 'auth/cancelled-popup-request': 'הבקשה בוטלה, נסה שוב.', 'auth/network-request-failed': 'בעיית רשת, נסה שוב.' };
              $('#gerr').textContent = (m[c] || 'ההתחברות נכשלה') + ' [' + c + ']';
            });
          };
          return; }
        if (CONFIG.ownerEmails.indexOf((u.email || '').toLowerCase()) < 0 || !u.emailVerified) { box.innerHTML = '<p>אין הרשאה למשתמש ' + esc(u.email) + '</p><button class="btn ghost" id="lo">התנתק</button>'; $('#lo').onclick = function () { fb.auth.signOut(); }; return; }
        adminBody();
      });
    } else { $('#adm').innerHTML = '<div class="note">מצב הדגמה: מוצגות הזמנות שנשמרו במכשיר הזה בלבד.</div><div id="adb"></div>'; adminBody(); }
  }
  var STAT = { 'new': 'חדשה', prep: 'בהכנה', ready: 'מוכנה', done: 'נמסרה' }, NEXT = { 'new': 'prep', prep: 'ready', ready: 'done' };
  function adminBody() {
    var box = $('#adb') || $('#adm');
    box.innerHTML = '<div class="tabs"><button class="btn" id="t1">הזמנות</button><button class="btn ghost" id="t2">קופונים</button></div><div id="ap"></div>';
    var tab = 1, orders = [], coupons = [];
    function paint() {
      var p = $('#ap'); if (!p) return;
      $('#t1').className = 'btn' + (tab === 1 ? '' : ' ghost'); $('#t2').className = 'btn' + (tab === 2 ? '' : ' ghost');
      if (tab === 1) {
        if (!orders.length) { p.innerHTML = '<p>אין הזמנות עדיין.</p>'; return; }
        p.innerHTML = orders.map(function (o) {
          var tm = o.tsd ? new Date(o.tsd).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : '';
          return '<div class="ord"><header><span>#' + esc(o.id) + ' · ' + esc(o.name) + '</span><span class="st ' + esc(o.status) + '">' + esc(STAT[o.status] || o.status) + '</span></header><div>📞 <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a> · ⏰ ' + esc(o.pickup) + ' · ' + esc(tm) + '</div><ul>' + o.items.map(function (i) { return '<li>' + i.qty + '× ' + esc(i.name) + (i.opt ? ' (' + esc(i.opt) + ')' : '') + '</li>'; }).join('') + '</ul>' + (o.note ? '<div>📝 ' + esc(o.note) + '</div>' : '') + '<div><b>' + money(o.total) + '</b>' + (o.coupon ? ' · קופון ' + esc(o.coupon) + ' (−' + money(o.discount) + ')' : '') + '</div>' + (NEXT[o.status] ? '<button class="btn alt" data-adv="' + esc(o.id) + '" data-to="' + NEXT[o.status] + '" style="margin-top:8px">סמן: ' + STAT[NEXT[o.status]] + '</button>' : '') + '</div>';
        }).join('');
      } else {
        p.innerHTML = '<table class="tbl"><tr><th>קוד</th><th>הנחה</th><th>מינימום</th><th>תוקף</th><th></th></tr>' + coupons.map(function (c) { return '<tr><td><b>' + esc(c.code) + '</b></td><td>' + (c.type === 'percent' ? c.value + '%' : money(c.value)) + '</td><td>' + (c.min ? money(c.min) : '—') + '</td><td>' + esc(c.expires || '—') + '</td><td><button class="opt" data-del="' + esc(c.code) + '">מחק</button></td></tr>'; }).join('') + '</table>' +
          '<h3>קופון חדש</h3><div class="grid2"><label class="field"><span>קוד</span><input id="nc" type="text" maxlength="20" style="text-transform:uppercase"></label><label class="field"><span>סוג</span><select id="nt"><option value="percent">אחוזים</option><option value="fixed">סכום קבוע (₪)</option></select></label><label class="field"><span>ערך</span><input id="nv" type="number" min="1" max="1000"></label><label class="field"><span>מינימום הזמנה (₪)</span><input id="nm" type="number" min="0" value="0"></label><label class="field"><span>תוקף עד (אופציונלי)</span><input id="ne" type="date"></label></div><button class="btn" id="nadd">הוסף קופון</button><div class="msg err" id="nerr"></div>';
      }
    }
    $('#t1').onclick = function () { tab = 1; paint(); }; $('#t2').onclick = function () { tab = 2; paint(); };
    $('#ap').addEventListener('click', function (e) {
      var a = e.target.closest('[data-adv]'); if (a) { store.setStatus(a.dataset.adv, a.dataset.to).then(function () { if (store.mode === 'local') { store.watchOrders(function (o) { orders = o; paint(); }); } }); return; }
      var d = e.target.closest('[data-del]'); if (d) { store.deleteCoupon(d.dataset.del).then(function () { if (store.mode === 'local') { store.watchCoupons(function (c) { coupons = c; paint(); }); } }); return; }
      if (e.target.id === 'nadd') {
        var code = ($('#nc').value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, ''), v = Number($('#nv').value), t = $('#nt').value, er = $('#nerr');
        if (code.length < 3) { er.textContent = 'קוד קצר מדי (לפחות 3 תווים באנגלית/מספרים)'; return; }
        if (!(v > 0) || (t === 'percent' && v > 100)) { er.textContent = 'ערך לא תקין'; return; }
        store.saveCoupon({ code: code, type: t, value: v, min: Number($('#nm').value) || 0, expires: $('#ne').value || '', active: true }).then(function () { if (store.mode === 'local') { store.watchCoupons(function (c) { coupons = c; paint(); }); } });
      }
    });
    store.watchOrders(function (o, err) { if (err) { $('#ap').innerHTML = '<p>אין הרשאה לקרוא הזמנות.</p>'; return; } orders = o; paint(); });
    store.watchCoupons(function (c) { if (c) { coupons = c; paint(); } });
  }

  /* =====================  אתחול  ===================== */
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip'); if (chip) { var s = $('#cat-' + chip.dataset.cat); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var item = e.target.closest('.item'); if (!item) return;
    var id = item.dataset.item, it = findItem(id), o = selOpt[id] == null ? 0 : selOpt[id];
    var op = e.target.closest('.opt'); if (op) { selOpt[id] = Number(op.dataset.opt); renderMenuKeep(); return; }
    if (e.target.closest('[data-plus]')) { change(id, it.opts ? o : null, 1); renderMenuKeep(); }
    else if (e.target.closest('[data-minus]')) { change(id, it.opts ? o : null, -1); renderMenuKeep(); }
  });
  $('#cartBtn').onclick = openCheckout;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  function route() { if (location.hash === '#admin') renderAdmin(); else { closeModal(); renderMenu(); } }
  window.addEventListener('hashchange', route);
  var init = CONFIG.firebase ? fbStore().catch(function () { return localStore(); }) : Promise.resolve(localStore());
  init.then(function (s) { store = s; route(); });
  window.__salads = { cart: function () { return cart; }, store: function () { return store; } };
})();
</script>
</body>
</html>
